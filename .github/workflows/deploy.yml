name: Multi-Environment Deployment

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string
      folder:
        description: 'Folder to deploy'
        required: true
        type: choice
        options:
          - backend
          - frontend
          - local-backend
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - local
          - cloud

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      
      - name: Setup Node.js (for frontend)
        if: github.event.inputs.folder == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Setup Go (for backend/local-backend)
        if: github.event.inputs.folder == 'backend' || github.event.inputs.folder == 'local-backend'
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
      
      - name: Build Frontend
        if: github.event.inputs.folder == 'frontend'
        run: |
          cd frontend
          npm ci
          npm run build
      
      - name: Build Backend
        if: github.event.inputs.folder == 'backend'
        run: |
          cd backend
          go mod download
          go build -o server main.go
      
      - name: Build Local Backend
        if: github.event.inputs.folder == 'local-backend'
        run: |
          cd local-backend
          go mod download
          go build -o local-server cmd/server/main.go
      
      # Local Environment Deployments (Git only)
      - name: Local Deploy - Create Release
        if: github.event.inputs.environment == 'local'
        run: |
          echo "Creating local deployment release for ${{ github.event.inputs.folder }}"
          echo "Branch: ${{ github.event.inputs.branch }}"
          echo "Folder: ${{ github.event.inputs.folder }}"
          echo "Environment: local"
          
          # Create deployment tag
          TAG_NAME="deploy-${{ github.event.inputs.folder }}-local-$(date +%Y%m%d-%H%M%S)"
          git tag $TAG_NAME
          git push origin $TAG_NAME
          
          echo "Local deployment completed with tag: $TAG_NAME"
      
      # Cloud Environment Deployments
      - name: Cloud Deploy - Frontend to S3
        if: github.event.inputs.folder == 'frontend' && github.event.inputs.environment == 'cloud'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          # Install AWS CLI
          pip install awscli
          
          # Sync build files to S3
          cd frontend
          aws s3 sync dist/ s3://$S3_BUCKET --delete
          
          # Invalidate CloudFront if distribution ID is provided
          if [ ! -z "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
          fi
          
          echo "Frontend deployed to S3: $S3_BUCKET"
      
      - name: Cloud Deploy - Backend to EC2
        if: (github.event.inputs.folder == 'backend' || github.event.inputs.folder == 'local-backend') && github.event.inputs.environment == 'cloud'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # Determine binary name and service name
          if [ "${{ github.event.inputs.folder }}" == "backend" ]; then
            BINARY_NAME="server"
            SERVICE_NAME="workflow-backend"
            LOCAL_PATH="backend/server"
          else
            BINARY_NAME="local-server"
            SERVICE_NAME="workflow-local-backend"
            LOCAL_PATH="local-backend/local-server"
          fi
          
          # Copy binary to EC2
          scp -i ~/.ssh/id_rsa $LOCAL_PATH $EC2_USER@$EC2_HOST:/tmp/$BINARY_NAME
          
          # Deploy on EC2
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST << EOF
            # Stop existing service
            sudo systemctl stop $SERVICE_NAME || true
            
            # Backup current binary
            sudo cp /opt/workflow/$BINARY_NAME /opt/workflow/${BINARY_NAME}.backup || true
            
            # Deploy new binary
            sudo mkdir -p /opt/workflow
            sudo mv /tmp/$BINARY_NAME /opt/workflow/
            sudo chmod +x /opt/workflow/$BINARY_NAME
            sudo chown root:root /opt/workflow/$BINARY_NAME
            
            # Start service
            sudo systemctl start $SERVICE_NAME
            sudo systemctl enable $SERVICE_NAME
            
            # Check service status
            sudo systemctl status $SERVICE_NAME
          EOF
          
          echo "${{ github.event.inputs.folder }} deployed to EC2: $EC2_HOST"
      
      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.event.inputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Folder**: ${{ github.event.inputs.folder }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Deployment Result
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ Deployment successful!"
            echo "Branch: ${{ github.event.inputs.branch }}"
            echo "Folder: ${{ github.event.inputs.folder }}"
            echo "Environment: ${{ github.event.inputs.environment }}"
          else
            echo "❌ Deployment failed!"
            echo "Please check the logs for more details."
          fi