name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

          echo "🚀 Deploying backend to $EC2_HOST"

          # Copy backend files to EC2
          scp -i ~/.ssh/id_rsa -r backend $EC2_USER@$EC2_HOST:/tmp/

          # Deploy with Docker
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST << 'EOF'
            cd /tmp/backend

            # Stop existing container
            docker-compose down || true

            # Build and start new container
            GITHUB_TOKEN=$GITHUB_TOKEN docker-compose up -d --build

            # Check container status
            docker-compose ps
            docker-compose logs --tail=50

            # Cleanup
            docker image prune -f
          EOF

          echo "✅ Backend deployed successfully"

      - name: Deployment Summary
        run: |
          echo "## Backend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.event.inputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Cloud (Production)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Host**: ${{ secrets.EC2_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY

  notify:
    needs: deploy-backend
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Deployment Result
        run: |
          if [ "${{ needs.deploy-backend.result }}" == "success" ]; then
            echo "✅ Backend deployment successful!"
            echo "Branch: ${{ github.event.inputs.branch }}"
          else
            echo "❌ Backend deployment failed!"
            echo "Please check the logs for more details."
          fi