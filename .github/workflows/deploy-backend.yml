name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build backend
        run: |
          cd backend
          go mod download
          go build -o server main.go
          echo "✅ Built backend server"

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

          echo "🚀 Deploying backend to $EC2_HOST"

          # Copy binary to EC2
          scp -i ~/.ssh/id_rsa backend/server $EC2_USER@$EC2_HOST:/tmp/server

          # Deploy on EC2
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST << 'EOF'
            # Stop existing service
            sudo systemctl stop workflow-backend || true

            # Backup current binary
            sudo cp /opt/workflow/server /opt/workflow/server.backup.$(date +%Y%m%d-%H%M%S) || true

            # Deploy new binary
            sudo mkdir -p /opt/workflow
            sudo mv /tmp/server /opt/workflow/
            sudo chmod +x /opt/workflow/server
            sudo chown root:root /opt/workflow/server

            # Start service
            sudo systemctl start workflow-backend
            sudo systemctl enable workflow-backend

            # Check service status
            sleep 2
            sudo systemctl status workflow-backend --no-pager
          EOF

          echo "✅ Backend deployed successfully"

      - name: Deployment Summary
        run: |
          echo "## Backend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.event.inputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Cloud (Production)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Host**: ${{ secrets.EC2_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY

  notify:
    needs: deploy-backend
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Deployment Result
        run: |
          if [ "${{ needs.deploy-backend.result }}" == "success" ]; then
            echo "✅ Backend deployment successful!"
            echo "Branch: ${{ github.event.inputs.branch }}"
          else
            echo "❌ Backend deployment failed!"
            echo "Please check the logs for more details."
          fi