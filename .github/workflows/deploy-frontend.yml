name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - local
          - cloud

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Build application
        run: |
          cd frontend
          npm run build
        env:
          # Environment-specific variables
          REACT_APP_API_URL: ${{ github.event.inputs.environment == 'cloud' && secrets.CLOUD_API_URL || secrets.LOCAL_API_URL }}
          REACT_APP_ENV: ${{ github.event.inputs.environment }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Set S3 bucket name
        id: bucket
        run: |
          if [ "${{ github.event.inputs.environment }}" == "cloud" ]; then
            echo "bucket_name=jokertrickster-workflow" >> $GITHUB_OUTPUT
          else
            echo "bucket_name=jokertrickster-workflow-local" >> $GITHUB_OUTPUT
          fi
      
      - name: Deploy to S3
        run: |
          cd frontend
          aws s3 sync dist/ s3://${{ steps.bucket.outputs.bucket_name }} --delete --acl public-read
          echo "Frontend deployed to S3 bucket: ${{ steps.bucket.outputs.bucket_name }}"
      
      - name: Invalidate CloudFront
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
          echo "CloudFront cache invalidated"
      
      - name: Deployment Summary
        run: |
          echo "## Frontend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.event.inputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: ${{ steps.bucket.outputs.bucket_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.bucket.outputs.bucket_name }}" == "jokertrickster-workflow" ]; then
            echo "- **URL**: https://jokertrickster-workflow.s3-website-${{ secrets.AWS_REGION }}.amazonaws.com" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **URL**: https://jokertrickster-workflow-local.s3-website-${{ secrets.AWS_REGION }}.amazonaws.com" >> $GITHUB_STEP_SUMMARY
          fi

  notify:
    needs: deploy-frontend
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Deployment Result
        run: |
          if [ "${{ needs.deploy-frontend.result }}" == "success" ]; then
            echo "✅ Frontend deployment successful!"
            echo "Branch: ${{ github.event.inputs.branch }}"
            echo "Environment: ${{ github.event.inputs.environment }}"
          else
            echo "❌ Frontend deployment failed!"
            echo "Please check the logs for more details."
          fi